<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | YumFoods</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

    <div class="login-container fade-in">
        <div class="login-header">
            <h2><i class="fas fa-utensils"></i> YumFoods</h2>
            <p>Welcome back! Please login to your account.</p>
        </div>
        
        <form id="login-form">
            <div class="input-group">
                <i class="fas fa-user icon"></i>
                <input type="text" id="login-email" placeholder="Email or Username">
                <div class="error-message" id="email-error">Please enter your email or username.</div>
            </div>
            
            <div class="input-group">
                <i class="fas fa-lock icon"></i>
                <input type="password" id="login-password" placeholder="Password">
                <i class="fas fa-eye toggle-password" id="toggle-password"></i>
                <div class="error-message" id="password-error">Please enter your password.</div>
            </div>
            
            <div class="login-options">
                <label><input type="checkbox" id="remember-me"> Remember Me</label>
                <a href="#">Forgot Password?</a>
            </div>
            
            <button type="submit" class="btn primary-btn" style="width: 100%; font-size: 1.1rem; padding: 12px;" id="login-btn">Login</button>
            
            <div class="register-link">
                Don't have an account? <a href="#">Sign Up</a>
            </div>
        </form>
    </div>

    <script src="login.js"></script>
</body>
</html>
